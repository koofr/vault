[package]
name = "vault-desktop-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
bytes = "1.11.0"
data-encoding = "2.9.0"
directories-next = "2.0.0"
dirs-sys-next = "0.1.2"
drop-stream = "0.3.2"
futures = "0.3.31"
http-body-util = "0.1.3"
keyring = "2.3.3"
log = "0.4.29"
mime = "0.3.17"
open = "5.3.3"
rand_core = "0.6.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
serde_urlencoded = "0.7.1"
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-util = { version = "0.7.17", features = ["compat"] }
tower = { version = "0.5.2" }
tower-http = { version = "0.6.8", features = ["cors"] }
# uuid cannot be upgraded to > 1.12.1 because we cannot use rand_core > 0.6
uuid = { version = "=1.12.1", features = ["v4", "fast-rng"] }
vault-core = { path = "../vault-core" }
vault-crypto = { path = "../vault-crypto" }
vault-native = { path = "../vault-native" }
vault-web-api = { path = "../vault-web-api" }

[dev-dependencies]
similar-asserts = "1.7.0"
urlencoding = "2.1.3"

[lib]
name = "vault_desktop_server"
path = "src/lib.rs"

[[bin]]
name = "desktop_server"
path = "src/main.rs"
