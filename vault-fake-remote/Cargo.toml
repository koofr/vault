[package]
name = "vault-fake-remote"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["ws", "multipart", "http2"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
form_urlencoded = "1.2.2"
futures = "0.3.31"
hex = "0.4.3"
http = "1.4.0"
http-body-util = "0.1.3"
http-range-header = "0.4.0"
log = "0.4.29"
mime = "0.3.17"
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
rustls = { version = "0.23.35", default-features = false, features = [
  "std",
  "tls12",
  "ring",
] }
serde = "1.0.228"
serde_json = "1.0.147"
thiserror = "2.0.17"
tokio = { version = "1.35.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
tokio-tungstenite = { version = "0.28.0", features = [
  "rustls-tls-webpki-roots",
] }
tokio-util = { version = "0.7.10", features = ["compat"] }
tower = "0.5.2"
urlencoding = "2.1.3"
# uuid cannot be upgraded to > 1.12.1 because we cannot use rand_core > 0.6
uuid = { version = "=1.12.1", features = ["v4", "fast-rng"] }
vault-core = { path = "../vault-core" }

[lib]
name = "vault_fake_remote"
path = "src/lib.rs"

[[bin]]
name = "fake_remote"
path = "src/main.rs"
