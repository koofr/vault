[package]
name = "vault-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1.89"
futures = "0.3.31"
# getrandom cannot be upgraded to > 0.2 because vault-crypto depends on
# crypto_secretbox which depends on aead which depends on crypto-common which
# depends on rand_core ^0.6 and we should not have multiple versions of
# rand_core and getrandom in our WASM build
getrandom = { version = "=0.2.16", features = ["js"] }
http = "1.4.0"
js-sys = "0.3.83"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.17"
tsify = { version = "0.5.6", features = ["js"] }
vault-core = { path = "../vault-core" }
vault-crypto = { path = "../vault-crypto" }
vault-web-api = { path = "../vault-web-api" }
vault-file-icon = { path = "../vault-file-icon", default-features = false }
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
wasm-streams = "0.4.2"
web-sys = { version = "0.3.83", features = [
  'AbortController',
  'AbortSignal',
  'Blob',
  'BlobPropertyBag',
  'console',
  'File',
  'Headers',
  'Storage',
  'ReadableStream',
  'Request',
  'RequestInit',
  'RequestMode',
  'Response',
  'Window',
] }
