[package]
name = "vault-mobile"
version.workspace = true
edition.workspace = true

[lib]
name = "vault_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
async-trait = "0.1.89"
env_logger = "0.11.0"
futures = "0.3.31"
lazy_static = "1.5.0"
log = "0.4.29"
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
thiserror = "2.0.17"
tokio = { version = "1.35.1", features = ["rt-multi-thread"] }
tokio-tungstenite = { version = "0.28.0", features = [
  "rustls-tls-webpki-roots",
] }
tokio-util = { version = "0.7.10", features = ["compat"] }
uniffi = "0.29.4"
# uuid cannot be upgraded to > 1.12.1 because we cannot use rand_core > 0.6
uuid = { version = "=1.12.1", features = ["v4", "fast-rng"] }
vault-core = { path = "../vault-core" }
vault-crypto = { path = "../vault-crypto" }
vault-fake-remote = { path = "../vault-fake-remote" }
vault-file-icon = { path = "../vault-file-icon" }
vault-native = { path = "../vault-native" }
vault-version = { path = "../vault-version" }

[dev-dependencies]
http = "1.4.0"
similar-asserts = "1.5.0"
vault-core-tests = { path = "../vault-core-tests" }

[build-dependencies]
uniffi = { version = "0.29.4", features = ["build"] }
